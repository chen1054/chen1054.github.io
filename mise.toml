[tasks.preview]
description = "Serve the portfolio locally with caching off, so every browser and simulator loads the current files"
run = """python3 -c '
import http.server
class NoStoreHandler(http.server.SimpleHTTPRequestHandler):
    def end_headers(self):
        self.send_header("Cache-Control", "no-store")
        super().end_headers()
http.server.ThreadingHTTPServer(("127.0.0.1", 4173), NoStoreHandler).serve_forever()
'"""
