<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta
    name="description"
    content="Contact Xinyan Chen about product design, collaborations, and creative opportunities."
  >
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self';
      style-src 'self' https://hcaptcha.com https://*.hcaptcha.com;
      img-src 'self' data:;
      font-src 'self';
      script-src 'self' https://web3forms.com/client/script.js https://hcaptcha.com https://*.hcaptcha.com;
      connect-src https://hcaptcha.com https://*.hcaptcha.com;
      frame-src https://hcaptcha.com https://*.hcaptcha.com;
      object-src 'none';
      base-uri 'self';
      form-action https://api.web3forms.com https://web3forms.com"
  >
  <title>Contact | Xinyan Chen</title>
  <link
    rel="icon"
    href="favicon.ico"
    sizes="32x32"
  >
  <link
    rel="icon"
    href="icon.svg"
    type="image/svg+xml"
  >
  <link
    rel="apple-touch-icon"
    href="apple-touch-icon.png"
  >
  <link
    rel="stylesheet"
    href="styles.css"
  >
  <script
    type="module"
    src="portfolio-navigation.mjs"
  ></script>
  <script
    type="module"
    src="contact-form-captcha-validation.mjs"
  ></script>
</head>
<body class="portfolio-contact-page">
  <main
    class="contact-page-content"
    aria-labelledby="contact-page-introduction-heading"
  >
    <picture class="portfolio-page-top-corner-decorations">
      <source
        media="(width>=40rem)"
        srcset="assets/home-wide-top-corner-decorations.svg"
      >
      <img
        src="assets/home-introduction-top-corner-decorations.svg"
        alt=""
        width="390"
        height="120"
      >
    </picture>
    <button
      class="phone-navigation-menu-toggle-button"
      type="button"
      aria-label="Open navigation menu"
      popovertarget="portfolio-primary-navigation"
    ></button>
    <nav
      id="portfolio-primary-navigation"
      aria-label="Primary navigation"
      popover
    >
      <img
        class="portfolio-wide-navigation-floral-logo"
        src="assets/home-wide-navigation-floral-logo.svg"
        alt=""
        width="48"
        height="63"
      >
      <button
        class="phone-navigation-menu-toggle-button"
        type="button"
        aria-label="Close navigation menu"
        popovertarget="portfolio-primary-navigation"
        popovertargetaction="hide"
        autofocus
      >
        <img
          src="assets/phone-navigation-menu-hamburger-icon.svg"
          alt=""
          width="48"
          height="48"
        >
      </button>
      <a
        href="./"
      >Home</a>
      <a
        href="about.html"
      >About</a>
      <a href="./#tales-for-safer-trails-project">Work</a>
      <a
        href="contact.html"
        aria-current="page"
      >Contact</a>
    </nav>
    <h1 id="contact-page-introduction-heading">Contact Me</h1>
    <div class="contact-page-details-and-message-form">
      <p class="contact-page-invitation">
        If you have any questions or comments, please contact me via email or phone,
        or send me a message using the contact form.
      </p>
      <div class="contact-page-email-and-decorative-wave">
        <div>
          <h2>Email</h2>
          <a
            class="contact-page-email-link"
            href="mailto:rainbowchen.ccc@gmail.com"
          >rainbowchen.ccc@gmail.com</a>
        </div>
        <div
          class="portfolio-page-decorative-wave-composition
            contact-page-email-divider-wave-composition"
          aria-hidden="true"
        >
          <picture>
            <source
              media="(width>=40rem)"
              srcset="assets/contact-wide-email-divider-gold-band.svg"
            >
            <img
              src="assets/contact-phone-email-divider-gold-band.svg"
              alt=""
              width="350"
              height="56"
            >
          </picture>
          <picture>
            <source
              media="(width>=40rem)"
              srcset="assets/contact-wide-email-divider-upper-gray-ribbon.svg"
            >
            <img
              src="assets/contact-phone-email-divider-upper-gray-ribbon.svg"
              alt=""
              width="350"
              height="56"
            >
          </picture>
          <picture>
            <source
              media="(width>=40rem)"
              srcset="assets/contact-wide-email-divider-bottom-gray-stripe.svg"
            >
            <img
              src="assets/contact-phone-email-divider-bottom-gray-stripe.svg"
              alt=""
              width="350"
              height="56"
            >
          </picture>
          <picture>
            <source
              media="(width>=40rem)"
              srcset="assets/contact-wide-email-divider-top-gray-stripe.svg"
            >
            <img
              src="assets/contact-phone-email-divider-top-gray-stripe.svg"
              alt=""
              width="350"
              height="56"
            >
          </picture>
          <picture>
            <source
              media="(width>=40rem)"
              srcset="assets/contact-wide-email-divider-middle-gray-stripe.svg"
            >
            <img
              src="assets/contact-phone-email-divider-middle-gray-stripe.svg"
              alt=""
              width="350"
              height="56"
            >
          </picture>
          <picture>
            <source
              media="(width>=40rem)"
              srcset="assets/contact-wide-email-divider-floral-accent.svg"
            >
            <img
              src="assets/contact-phone-email-divider-floral-accent.svg"
              alt=""
              width="350"
              height="56"
            >
          </picture>
        </div>
      </div>
      <form
        class="contact-page-message-form"
        action="https://api.web3forms.com/submit"
        method="POST"
      >
        <input
          type="hidden"
          name="access_key"
          value="79405d54-fe0c-48ca-99ac-695c47cc6911"
        >
        <input
          type="hidden"
          name="subject"
          value="Portfolio contact message"
        >
        <div class="contact-page-name-and-phone-fields">
        <label
          class="contact-page-form-field"
          for="contact-form-name"
        >
          Name(required)<span aria-hidden="true">*</span>
          <input
            id="contact-form-name"
            type="text"
            name="name"
            autocomplete="name"
            required
          >
        </label>
        <label
          class="contact-page-form-field"
          for="contact-form-phone"
        >
          Phone
          <input
            id="contact-form-phone"
            type="tel"
            name="phone"
            autocomplete="tel"
            
          >
        </label>
        </div>
        <label
          class="contact-page-form-field"
          for="contact-form-email"
        >
          Email(required)<span aria-hidden="true">*</span>
          <input
            id="contact-form-email"
            type="email"
            name="email"
            autocomplete="email"
            required
          >
        </label>
        <label
          class="contact-page-form-field"
          for="contact-form-message"
        >
          Message(required)<span aria-hidden="true">*</span>
          <textarea
            id="contact-form-message"
            name="message"
            rows="5"
            required
          ></textarea>
        </label>
        <div
          class="h-captcha"
          data-captcha="true"
          data-size="compact"
        ></div>
        <noscript>
          Enable JavaScript to complete the captcha, or use the email link.
        </noscript>
        <button
          class="contact-page-send-message-button"
          type="submit"
        >Send</button>
      </form>
    </div>
  </main>
  <footer class="portfolio-page-thank-you-and-copyright-footer">
    <p>Thank you for your interest in my work!</p>
    <p class="portfolio-page-copyright-and-creation-tool">
      <span>Made with VS Code</span>
      <span>© 2026 Xinyan Chen</span>
    </p>
    <div
      class="portfolio-page-decorative-wave-composition
        contact-page-footer-bottom-wave-composition"
      aria-hidden="true"
    >
      <picture>
        <source
          media="(width>=40rem)"
          srcset="assets/about-wide-footer-gold-wave.svg"
          width="1440"
          height="360"
        >
        <img
          src="assets/about-phone-footer-gold-wave.svg"
          alt=""
          width="390"
          height="161"
        >
      </picture>
      <picture>
        <source
          media="(width>=40rem)"
          srcset="assets/about-wide-footer-upper-gray-wave.svg"
          width="1440"
          height="360"
        >
        <img
          src="assets/about-phone-footer-upper-gray-wave.svg"
          alt=""
          width="390"
          height="161"
        >
      </picture>
      <picture>
        <source
          media="(width>=40rem)"
          srcset="assets/about-wide-footer-lower-gray-wave.svg"
          width="1440"
          height="360"
        >
        <img
          src="assets/about-phone-footer-lower-gray-wave.svg"
          alt=""
          width="390"
          height="161"
        >
      </picture>
    </div>
  </footer>
  <a
    class="portfolio-back-to-top-link"
    href="#"
    aria-label="Back to top"
    hidden
  ></a>
  <!-- The form's vendor scripts are an approved exception to local module/.mjs scripts. -->
  <script
    src="https://web3forms.com/client/script.js"
    async
    defer
  ></script>
</body>
</html>
